# Fork only: build the Docker image from the Linux zips in the `nightly`
# prerelease and push ghcr.io/<owner>/easytier:nightly and :<version>.
# Fork Promote later points :stable at the same image.
name: Fork Docker

on:
  workflow_run:
    workflows: [EasyTier Nightly]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: fork-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: >-
      github.repository != 'EasyTier/EasyTier' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download nightly Linux zips
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha)
          gh release download nightly --repo "$GITHUB_REPOSITORY" --dir zips \
            --pattern 'easytier-linux-x86_64-*.zip' --pattern 'easytier-linux-aarch64-*.zip'
          zip=$(ls zips/easytier-linux-x86_64-*.zip)
          version=$(basename "$zip" .zip | sed 's/^easytier-linux-x86_64-//')
          mkdir docker_context
          for f in zips/*.zip; do unzip -q "$f" -d docker_context; done
          ls -lR docker_context
          echo "tag=${version}-${sha:0:8}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/easytier" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: ./docker_context
          file: .github/workflows/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nightly.outputs.image }}:nightly
            ${{ steps.nightly.outputs.image }}:${{ steps.nightly.outputs.tag }}
